objective: "Evaluate HLP-004 migration to the first-party CLI parser package while preserving Fence safety and boundary validation semantics."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: source_checks
    command: "for f in fence.kujo src/*.kujo tests/*.kujo; do /Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo check $f >/dev/null || exit 1; done"
  - id: unit_tests
    command: "/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo run tests/fence_tests.kujo"
  - id: cli_smoke
    command: "KUJO=/Users/robertdevore/2026/Kujolang/kujo-repos/kujo/target/debug/kujo bash tests/cli_smoke.sh"
  - id: diff_check
    command: "git diff --check"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
