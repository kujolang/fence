# Example CI workflow for Fence.
#
# This YAML is configuration (not an implementation language), which is allowed
# alongside the Kujo-only tool. Adjust the "Install Kujo" step to your
# environment. CI builds the pinned supported Kujo runtime from source.
name: fence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # required for --changed-only --base

      - name: Checkout pinned Kujo runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kujolang/kujo
          ref: v1.0.1
          path: kujo-runtime
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
      - name: Cache Kujo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          workspaces: kujo-runtime
      - name: Build Kujo
        run: cargo build --release --locked --manifest-path kujo-runtime/Cargo.toml
      - name: Add Kujo to PATH
        run: echo "$PWD/kujo-runtime/target/release" >> "$GITHUB_PATH"

      - name: Lint Fence sources
        run: |
          for f in fence.kujo src/*.kujo tests/fence_tests.kujo; do
            kujo check "$f"
          done

      - name: Unit tests
        run: kujo run tests/fence_tests.kujo

      - name: CLI smoke tests
        run: sh tests/cli_smoke.sh

      - name: Architecture check (changed files)
        run: |
          kujo run fence.kujo -- check \
            --changed-only --base "origin/${{ github.base_ref || 'main' }}" \
            --format sarif --output fence.sarif --fail-on error

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: fence.sarif
