name: platform-verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout pinned Kujo runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kujolang/kujo
          ref: v1.0.1
          path: kujo-runtime
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
      - name: Cache Kujo build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.9.2
        with:
          workspaces: kujo-runtime
          cache-on-failure: true
      - name: Configure OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $opensslRoot = Split-Path (Split-Path (Get-Command openssl).Source)
          "OPENSSL_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_LIB_DIR=$opensslRoot\lib\VC\x64\MD" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build Kujo
        run: cargo build --release --locked --manifest-path kujo-runtime/Cargo.toml
      - name: Add Kujo to PATH
        shell: bash
        run: echo "$PWD/kujo-runtime/target/release" >> "$GITHUB_PATH"
      - name: Run full Fence release verification
        shell: bash
        run: kujo run scripts/verify_release.kujo
